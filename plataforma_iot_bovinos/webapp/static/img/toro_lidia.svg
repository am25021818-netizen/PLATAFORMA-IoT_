<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="hornGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
  </defs>

  <!-- Fondo circular sutil -->
  <circle cx="256" cy="256" r="240" fill="#0f172a" stroke="#2563eb" stroke-width="8"/>
  <circle cx="256" cy="256" r="225" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- Cuernos Afilados de Toro de Lidia (Astifino) -->
  <!-- Cuerno Izquierdo -->
  <path d="M 180 230 C 130 180, 70 120, 60 40 C 95 70, 150 150, 195 200 Z" fill="url(#hornGrad)" stroke="#475569" stroke-width="2"/>
  <!-- Cuerno Derecho -->
  <path d="M 332 230 C 382 180, 442 120, 452 40 C 417 70, 362 150, 317 200 Z" fill="url(#hornGrad)" stroke="#475569" stroke-width="2"/>

  <!-- Morillo prominente y Cabeza Musculosa del Toro de Lidia -->
  <path d="M 160 210 C 120 250, 110 320, 130 380 C 150 430, 200 465, 256 470 C 312 465, 362 430, 382 380 C 402 320, 392 250, 352 210 C 320 180, 285 175, 256 175 C 227 175, 192 180, 160 210 Z" fill="url(#bullGrad)"/>

  <!-- Orejas Típicas Alertas -->
  <path d="M 160 230 C 110 225, 90 260, 125 280 C 145 270, 155 250, 160 230 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M 352 230 C 402 225, 422 260, 387 280 C 367 270, 357 250, 352 230 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>

  <!-- Frente y Testuz Rizado -->
  <path d="M 195 220 Q 256 240 317 220 Q 256 200 195 220 Z" fill="#334155"/>
  <path d="M 205 240 Q 256 255 307 240 Q 256 225 205 240 Z" fill="#1e293b"/>

  <!-- Ojos Bravos / Mirada Fija y Agresiva -->
  <polygon points="175,280 215,295 185,310" fill="url(#eyeGlow)"/>
  <circle cx="192" cy="295" r="4" fill="#ffffff"/>
  
  <polygon points="337,280 297,295 327,310" fill="url(#eyeGlow)"/>
  <circle cx="320" cy="295" r="4" fill="#ffffff"/>

  <!-- Hocico y Nariz Fuerte con Fosas Respirando -->
  <path d="M 210 395 C 210 445, 302 445, 302 395 C 302 380, 210 380, 210 395 Z" fill="#020617" stroke="#334155" stroke-width="3"/>
  <!-- Fosas Nasales Exhalando -->
  <ellipse cx="232" cy="405" rx="12" ry="16" fill="#0f172a"/>
  <ellipse cx="280" cy="405" rx="12" ry="16" fill="#0f172a"/>

  <!-- Aros / Ondas de Telemetría IoT en Cuernos -->
  <path d="M 230 110 A 30 30 0 0 1 282 110" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <path d="M 215 90 A 50 50 0 0 1 297 90" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <path d="M 200 70 A 70 70 0 0 1 312 70" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <circle cx="256" cy="130" r="5" fill="#2563eb"/>
</svg>
